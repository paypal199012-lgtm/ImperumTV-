name: App Store (Apple TV, kostenlos)

# Nur von Hand starten: GitHub → Actions → „App Store (iPhone, kostenlos)“ → Run workflow.
# Lädt die Store-Version zu App Store Connect hoch (danach dort einreichen).
#
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions), NIE in den Code oder Chat:
#   APPLE_TEAM_ID      – Team-ID (10 Zeichen) aus developer.apple.com → Membership
#   ASC_KEY_ID         – App Store Connect API-Schlüssel: Key ID
#   ASC_ISSUER_ID      – App Store Connect API-Schlüssel: Issuer ID
#   ASC_KEY_P8         – Inhalt der heruntergeladenen AuthKey_XXXX.p8 (ganze Datei)
# Optional (Repository-Variable, nicht geheim):
#   IOS_BUNDLE_ID      – Bundle-ID der App in App Store Connect (Standard: tv.imperum.app)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [web-ui]
    paths: ['tvos/STORE_UPLOAD']   # Start: Zahl in tvos/STORE_UPLOAD erhöhen und hochladen

jobs:
  upload:
    runs-on: macos-15-intel
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'tv.imperum.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Secrets prüfen
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""
          [ -n "$T" ] || miss="$miss APPLE_TEAM_ID"
          [ -n "$K" ] || miss="$miss ASC_KEY_ID"
          [ -n "$I" ] || miss="$miss ASC_ISSUER_ID"
          [ -n "$P" ] || miss="$miss ASC_KEY_P8"
          if [ -n "$miss" ]; then echo "::error::Es fehlen Secrets:$miss"; exit 1; fi
      - name: Store-Version einstellen
        run: |
          cd tvos
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          sed -i '' 's/MARKETING_VERSION: .*/MARKETING_VERSION: "1.0"/' project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
      - run: brew install xcodegen
      - run: cd tvos && xcodegen generate && pod install
      - name: API-Schlüssel ablegen
        env:
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$P" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archiv bauen (Signieren erst beim Hochladen, mit dem Vertriebszertifikat von Apple)
        run: |
          cd tvos
          xcodebuild -workspace ImperumTVtv.xcworkspace -scheme ImperumTV -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -archivePath build/ImperumTV.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO _EXPERIMENTAL_SWIFT_EXPLICIT_MODULES=NO \
            archive > ../build.log 2>&1
      - name: Zu App Store Connect hochladen
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath tvos/build/ImperumTV.xcarchive -exportPath tvos/build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} >> build.log 2>&1
          echo "Hochgeladen. In App Store Connect erscheint der Build nach etwa 10–30 Minuten unter TestFlight."
      - name: Fehler anzeigen
        if: failure()
        run: |
          echo "===== FEHLER ====="
          grep -iE "error|fatal|failed|cannot|no such|provision|sign" build.log | grep -v "^ *$" | sort -u | head -60 || true
          echo "===== LETZTE ZEILEN ====="
          tail -40 build.log || true
      - name: Schlüssel löschen
        if: always()
        run: rm -rf ~/private_keys
