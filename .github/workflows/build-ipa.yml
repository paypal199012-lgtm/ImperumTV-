name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: App bauen
        run: |
          xcodebuild -project IPTVPlayer.xcodeproj -scheme IPTVPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IPTVPlayer.app Payload/
          zip -r IPTVPlayer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-ipa
          path: IPTVPlayer.ipa
