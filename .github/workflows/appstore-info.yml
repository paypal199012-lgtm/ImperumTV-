# App-ID und Stand im App Store anzeigen (Hinweise im Lauf). Nur lesen.
name: App Store Info
on:
  workflow_dispatch:
  push:
    branches: [web-ui]
    paths: ['scripts/appstore_info.py', '.github/workflows/appstore-info.yml']
permissions:
  contents: read
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]"
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/appstore_info.py
