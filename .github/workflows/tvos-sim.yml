name: Apple TV (Simulator-Test)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [web-ui]
    paths:
      - 'tvos/**'
      - 'Models.swift'
      - 'XtreamAPI.swift'
      - 'Remote.swift'
      - 'Keychain.swift'
      - '.github/workflows/tvos-sim.yml'

jobs:
  sim:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Projekt erzeugen
        run: cd tvos && xcodegen generate
      - name: Für den Apple-TV-Simulator bauen
        run: |
          cd tvos
          set +e
          xcodebuild -project ImperumTVtv.xcodeproj -scheme ImperumTV -configuration Debug \
            -sdk appletvsimulator -destination 'generic/platform=tvOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "===== FEHLER ====="
            grep -E "error:|warning: .*will be an error" build.log | sort -u | head -80
            echo "===== LETZTE ZEILEN ====="
            tail -40 build.log
            mkdir -p sim-shots-tv && grep -E "error:" build.log | sort -u > sim-shots-tv/build-errors.txt
          fi
          exit $rc
      - name: Fehlerliste sichern
        if: failure()
        run: |
          cd tvos
          mkdir -p sim-shots && cp -f sim-shots-tv/build-errors.txt sim-shots/ 2>/dev/null || true
          cd ..
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tvos/sim-shots && git commit -m "Apple-TV-Baufehler [skip ci]" && git pull --rebase && git push || true
      - name: Simulator starten und Bildschirmfotos machen
        run: |
          cd tvos
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable') and 'tvOS' in x['name']]; print(r[-1]['identifier'])")
          DT=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          d=[x for x in json.load(sys.stdin)['devicetypes'] if 'Apple TV' in x['name']]
          p=[x for x in d if '1080p' in x['name']] or d
          print(p[-1]['identifier'])")
          echo "Laufzeit $RT, Gerät $DT"
          UDID=$(xcrun simctl create imptv-tv "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b || sleep 60
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          rm -rf sim-shots; mkdir -p sim-shots
          for s in playlists home live movies series seriesdetail epg settings player; do
            SIMCTL_CHILD_IMPTV_TEST=1 SIMCTL_CHILD_IMPTV_SCREEN=$s xcrun simctl launch --terminate-running-process "$UDID" tv.imperum.app || true
            if [ "$s" = "player" ] || [ "$s" = "live" ]; then sleep 25; else sleep 10; fi
            xcrun simctl io "$UDID" screenshot "sim-shots/$s.png" || true
          done
          xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'process == "ImperumTV"' > sim-shots/log.txt 2>/dev/null || true
          ls -la sim-shots
      - name: Bilder ins Repository
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tvos/sim-shots || true
          git commit -m "Apple-TV-Bilder [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
